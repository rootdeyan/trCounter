<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a1a, #2c2c2c, #3a3a3a);
            font-family: 'Roboto', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7), 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .countdown-text {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #00ffff;
        }

        .progress-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin: 0 auto; /* Center the progress bar */
        }

        .progress {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #00b7eb);
            animation: countdown 10s linear forwards;
            transform-origin: left;
        }

        @keyframes countdown {
            from {
                transform: scaleX(1);
            }
            to {
                transform: scaleX(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            .countdown-text {
                font-size: 1.2em;
            }
            .progress-bar {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Counter has been moved to a new domain</h1>
        <p class="countdown-text">You will be redirected in <span id="countdown">10</span> seconds</p>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
    </div>

    <script>
        let timeLeft = 10;
        const countdownElement = document.getElementById('countdown');

        const countdown = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = 'https://rootdeyan.info/TXTRevC/'; // Replace with your new domain URL
            }
        }, 1000);
    </script>
</body>
</html>
